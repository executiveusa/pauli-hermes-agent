# Agent MAXX runtime overlay for Hermes Agent.
#
# Usage:
#   API_SERVER_KEY='<secret>' docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.maxx.yml \
#     up -d --build gateway
#
# This keeps the Hermes image/runtime intact while giving MAXX its own durable
# home, persistent identity, and authenticated API surface. Secrets stay in the
# host environment / deployment secret store and are never committed here.

services:
  gateway:
    volumes:
      - ~/.hermes-maxx:/opt/data
      - ./deploy/maxx/SOUL.md:/opt/data/SOUL.md:ro
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=${API_SERVER_PORT:-8642}
      - API_SERVER_KEY=${API_SERVER_KEY:?API_SERVER_KEY is required for Agent MAXX}
    command: ["gateway", "run"]
