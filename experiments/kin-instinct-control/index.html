<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIN — Instinct Field Lab</title><meta name="description" content="Humanitarian deployment lab and control plane for Instinct agents."><style>
:root{--ink:#11130f;--paper:#f2f0e8;--muted:#6b6d66;--line:#d6d3c7;--signal:#ff5a1f;--dark:#171914;--green:#315d45;--yellow:#a86f00;--red:#8e3b2f}*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,input,select{font:inherit}main{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.rail{background:var(--dark);color:#f7f5ec;padding:26px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.mark{width:44px;height:44px;border:1px solid #5f6259;display:grid;place-items:center;font-size:24px;margin-bottom:18px}.brand{display:flex;flex-direction:column;gap:4px;margin-bottom:42px}.brand strong{font-size:18px;letter-spacing:.12em}.brand span{font-size:11px;color:#aaa;letter-spacing:.08em;text-transform:uppercase}nav{display:flex;flex-direction:column;gap:4px}nav button{border:0;background:transparent;color:#9fa297;text-align:left;padding:10px 0;text-transform:uppercase;font-size:11px;letter-spacing:.11em;cursor:pointer}nav button.active{color:white;border-bottom:1px solid #666b60}.railNote{margin-top:auto;font-size:11px;line-height:1.5;color:#85887f;border-top:1px solid #3a3d36;padding-top:16px}.workspace{padding:30px 34px 60px;max-width:1500px;width:100%;margin:auto}header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:22px}.eyebrow,.kicker{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}h1{font-size:44px;line-height:1;margin:8px 0 0;letter-spacing:-.04em;text-transform:capitalize}h2{font-size:24px;margin:7px 0 0;letter-spacing:-.03em}h3{font-size:19px;margin:12px 0 8px}.secure{font-size:10px;letter-spacing:.08em;color:var(--green);border:1px solid #b8c8bc;padding:8px 10px}.secure span{color:var(--signal)}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:22px}.metric{background:var(--paper);padding:17px 18px;display:flex;flex-direction:column}.metric strong{font-size:28px}.metric span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(330px,.8fr);gap:22px}.panel{border:1px solid var(--line);background:#f8f6ef;padding:20px}.panel.full{min-height:620px}.panelHead{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:16px}.panelHead input{max-width:220px}.tableWrap{max-height:620px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:9px;border-bottom:1px solid var(--line)}td{padding:11px 9px;border-bottom:1px solid #e2dfd4}tbody tr{cursor:pointer}tbody tr:hover,tbody tr.selected{background:#ebe7da}.badge{display:inline-block;border:1px solid #c6c4ba;padding:4px 6px;font-size:8px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}.badge.verified,.badge.confirmed,.badge.ready{color:var(--green);border-color:#aebdad}.badge.not-approved,.badge.paused{color:var(--red);border-color:#cdb0aa}.badge.rolling-out,.badge.unverified,.badge.simulation-first{color:var(--yellow);border-color:#d0b982}.detail label{display:flex;flex-direction:column;gap:5px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:13px 0}.detail input,.detail select,.panelHead input{width:100%;border:1px solid var(--line);background:#fffef9;padding:10px;color:var(--ink);outline:none}.detail input:focus,.detail select:focus,.panelHead input:focus{border-color:#7c7c73}.agentTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.callout{font-size:11px;line-height:1.5;background:#efede3;border-left:3px solid var(--signal);padding:11px;margin-top:14px}.ghost{background:transparent;border:1px solid var(--line);padding:9px 10px;margin-top:12px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}.cards{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:20px}.opp{display:grid;grid-template-columns:55px 1fr;gap:12px;padding:22px 16px;border-bottom:1px solid var(--line)}.opp:nth-child(odd){border-right:1px solid var(--line)}.rank{font-size:22px;color:#a4a198}.opp p,.lede,.pitch p{font-size:13px;line-height:1.55;color:#575a53}.scores{display:flex;gap:6px;flex-wrap:wrap}.scores span{font-size:9px;text-transform:uppercase;letter-spacing:.07em;border:1px solid var(--line);padding:5px}.cap{margin-top:22px}.cap td{padding:15px 9px}.steps{margin-top:22px;border-top:1px solid var(--line)}.step{display:grid;grid-template-columns:55px 1fr;border-bottom:1px solid var(--line);align-items:center}.step span{font-size:12px;color:var(--signal)}.step p{font-size:14px;margin:0;padding:15px 0}.danger{margin-top:24px;background:#201f1b;color:#f5f1e8;padding:18px;max-width:760px}.danger strong{text-transform:uppercase;font-size:10px;letter-spacing:.1em}.danger p{font-size:13px;line-height:1.5;color:#c9c6bd}.pitch blockquote{font-size:30px;line-height:1.18;letter-spacing:-.03em;margin:42px 0;max-width:980px;border-left:3px solid var(--signal);padding-left:20px}.pitchGrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}.pitchGrid>div{background:#f8f6ef;padding:22px}@media(max-width:900px){main{display:block}.rail{position:relative;height:auto;padding:18px}.brand{margin-bottom:14px}nav{flex-direction:row;overflow:auto}.railNote{display:none}.workspace{padding:20px 14px}.grid2,.cards,.pitchGrid{grid-template-columns:1fr}.opp:nth-child(odd){border-right:0}.metrics{grid-template-columns:repeat(2,1fr)}header{gap:10px}h1{font-size:34px}.secure{display:none}}@media(max-width:520px){.metrics{grid-template-columns:1fr 1fr}.grid2{display:block}.detail{margin-top:18px}.split{grid-template-columns:1fr}.cards{display:block}.pitch blockquote{font-size:23px}.panel{padding:15px}}

</style></head><body><main><aside class="rail"><div class="mark">K</div><div class="brand"><strong>KIN</strong><span>Instinct Field Lab</span></div><nav id="nav"></nav><div class="railNote">Mission: prove meaningful human outcomes with Instinct. No novelty demos.</div></aside><section class="workspace"><header><div><div class="eyebrow">KINDRED INSTINCT NETWORK</div><h1 id="title">50-agent control plane</h1></div><div class="secure">LOCAL DATA MODE <span>•</span> no founder PII uploaded</div></header><div id="view"></div></section></main><script>
const baseAgents = Array.from({length:50},(_,i)=>({id:`KIN-${String(i+1).padStart(3,'0')}`,slot:i+1,provisioningEmail:`kin${String(i+1).padStart(3,'0')}@yourdomain.com`,phone:'',instinctEmail:'',useCase:'',founder:'',org:'',status:i===0?'READY FOR SETUP':'AVAILABLE',risk:'LOW',proof:'0/3'}));
const opportunities=[
{rank:1,title:'Disability Administrative Navigator',impact:5,agent:5,safety:4,proof:5,stage:'FIRST FIELD TEST',note:'Voice-first navigation across scheduling, transport, follow-ups, benefits and service systems.'},
{rank:2,title:'Tiny Nonprofit Chief of Staff',impact:4,agent:5,safety:5,proof:5,stage:'CONTROL CASE',note:'Meetings, volunteer coordination, vendors, reminders, follow-up and operations for understaffed nonprofits.'},
{rank:3,title:'Remote Field Logistics Agent',impact:5,agent:5,safety:3,proof:4,stage:'SIMULATION FIRST',note:'Check-ins, travel changes, resource lookup and designated-contact escalation without making life-critical decisions.'},
{rank:4,title:'Caregiver Coordination Agent',impact:5,agent:4,safety:4,proof:4,stage:'RESEARCH',note:'Reduce coordination burden across appointments, transport, family updates and recurring tasks.'},
{rank:5,title:'Refugee / Migrant Service Navigator',impact:5,agent:5,safety:3,proof:3,stage:'RESEARCH',note:'Multilingual help locating services, preparing questions and tracking administrative follow-up.'},
{rank:6,title:'Elder Independence Agent',impact:5,agent:4,safety:3,proof:4,stage:'RESEARCH',note:'Voice-first digital task support for people who struggle with apps and fragmented interfaces.'},
{rank:7,title:'Founder Deployment Agent',impact:4,agent:5,safety:5,proof:5,stage:'READY',note:'Pretrained founder chief-of-staff package with handoff course and verification checklist.'},
{rank:8,title:'Community Resource Coordinator',impact:4,agent:4,safety:5,proof:4,stage:'BACKLOG',note:'Coordinate local resources, volunteers, schedules and outreach without requiring technical tooling.'}
];
const capabilities=[
['Text / call interface','CONFIRMED','Primary interface can stay familiar for non-technical users.'],
['Application + device context','CONFIRMED','Email, messaging, screen, audio, location and more are described publicly.'],
['Proactive contact','CONFIRMED','Can follow up and proactively call or text.'],
['Native Instinct email','CONFIRMED','Track separately from provisioning email; useful for agent-owned accounts.'],
['Concierge outbound calling','ROLLING OUT','Treat availability as account-specific until verified on each slot.'],
['Account transfer between humans','UNVERIFIED','Do not assume. Preserve human-controlled provisioning identity and recovery.'],
['Life-critical autonomy','NOT APPROVED','KIN requires human escalation and bounded workflows in safety-critical contexts.']
];
const statusOrder=['AVAILABLE','READY FOR SETUP','PROVISIONED','BASE TRAINED','TESTED','ASSIGNED','DEPLOYED','VERIFIED','PAUSED'];
let state={tab:'fleet',query:'',selected:'KIN-001',agents:loadAgents()};
function loadAgents(){try{return JSON.parse(localStorage.getItem('kin-agents-v1'))||structuredClone(baseAgents)}catch{return structuredClone(baseAgents)}}
function save(){localStorage.setItem('kin-agents-v1',JSON.stringify(state.agents))}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function badge(t){return `<span class="badge ${t.toLowerCase().replaceAll(' ','-').replaceAll('/','-')}">${esc(t)}</span>`}
function metric(n,l){return `<div class="metric"><strong>${n}</strong><span>${l}</span></div>`}
function renderNav(){document.getElementById('nav').innerHTML=['fleet','opportunities','capabilities','protocol','pitch'].map(t=>`<button data-tab="${t}" class="${state.tab===t?'active':''}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()})}
function render(){renderNav();document.getElementById('title').textContent=state.tab==='fleet'?'50-agent control plane':state.tab;const v=document.getElementById('view');if(state.tab==='fleet')v.innerHTML=fleet();if(state.tab==='opportunities')v.innerHTML=opps();if(state.tab==='capabilities')v.innerHTML=caps();if(state.tab==='protocol')v.innerHTML=protocol();if(state.tab==='pitch')v.innerHTML=pitch();bind()}
function fleet(){const c={available:state.agents.filter(a=>a.status==='AVAILABLE').length,active:state.agents.filter(a=>!['AVAILABLE','PAUSED'].includes(a.status)).length,deployed:state.agents.filter(a=>['DEPLOYED','VERIFIED'].includes(a.status)).length,verified:state.agents.filter(a=>a.status==='VERIFIED').length};const a=state.agents.find(a=>a.id===state.selected)||state.agents[0];const f=state.agents.filter(x=>(`${x.id} ${x.status} ${x.useCase} ${x.founder} ${x.org}`).toLowerCase().includes(state.query.toLowerCase()));return `<div class="metrics">${metric(50,'fleet slots')}${metric(c.available,'available')}${metric(c.active,'configured')}${metric(c.deployed,'deployed')}${metric(c.verified,'verified')}</div><div class="grid2"><section class="panel"><div class="panelHead"><div><span class="kicker">REGISTRY</span><h2>Agent fleet</h2></div><input id="query" placeholder="Search agents" value="${esc(state.query)}"></div><div class="tableWrap"><table><thead><tr><th>ID</th><th>Status</th><th>Use case</th><th>Proof</th></tr></thead><tbody>${f.map(x=>`<tr data-agent="${x.id}" class="${state.selected===x.id?'selected':''}"><td><b>${x.id}</b></td><td>${badge(x.status)}</td><td>${esc(x.useCase||'Unassigned')}</td><td>${x.proof}</td></tr>`).join('')}</tbody></table></div></section><section class="panel detail"><span class="kicker">SELECTED SLOT</span><div class="agentTitle"><h2>${a.id}</h2>${badge(a.status)}</div>${field('provisioningEmail','Provisioning email',a.provisioningEmail)}${field('phone','Phone / WhatsApp',a.phone,'keep private; stored only in this browser')}${field('instinctEmail','Native Instinct email',a.instinctEmail,'assigned after activation')}${field('useCase','Deployment mission',a.useCase,'e.g. Nonprofit Chief of Staff')}<div class="split">${field('founder','Founder',a.founder)}${field('org','Organization',a.org)}</div><label>Status<select id="status">${statusOrder.map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join('')}</select></label><label>Proof score<select id="proof">${['0/3','1/3','2/3','3/3'].map(s=>`<option ${s===a.proof?'selected':''}>${s}</option>`).join('')}</select></label><div class="callout">VERIFIED requires three real, documented tasks and owner confirmation. Deployment alone never counts.</div><button class="ghost" id="reset">Reset local registry</button></section></div>`}
function field(id,label,val,ph=''){return `<label>${label}<input id="${id}" value="${esc(val)}" placeholder="${esc(ph)}"></label>`}
function opps(){return `<section class="panel full"><div class="panelHead"><div><span class="kicker">OPPORTUNITY RADAR</span><h2>Human outcomes worth testing</h2></div></div><div class="cards">${opportunities.map(o=>`<article class="opp"><div class="rank">0${o.rank}</div><div>${badge(o.stage)}<h3>${o.title}</h3><p>${o.note}</p><div class="scores"><span>impact ${o.impact}/5</span><span>agent advantage ${o.agent}/5</span><span>safety ${o.safety}/5</span><span>proof ${o.proof}/5</span></div></div></article>`).join('')}</div></section>`}
function caps(){return `<section class="panel full"><span class="kicker">CAPABILITY MAP</span><h2>What KIN may rely on</h2><p class="lede">Confirmed capability is separated from assumption. Account-specific features must be verified before a deployment depends on them.</p><table class="cap"><thead><tr><th>Capability</th><th>State</th><th>KIN rule</th></tr></thead><tbody>${capabilities.map(r=>`<tr><td><b>${r[0]}</b></td><td>${badge(r[1])}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></section>`}
function protocol(){const steps=['Claim invite on controlled phone','Create provisioning identity + recovery record','Activate Instinct and record native email','Load KIN base doctrine','Assign one bounded human mission','Test permissions and escalation boundaries','Complete three real tasks','Founder handoff + 7-step course','Owner confirms outcomes','Mark VERIFIED and write case study'];return `<section class="panel full"><span class="kicker">DEPLOYMENT PROTOCOL</span><h2>Invite → verified human outcome</h2><div class="steps">${steps.map((s,i)=>`<div class="step"><span>${String(i+1).padStart(2,'0')}</span><p>${s}</p></div>`).join('')}</div><div class="danger"><strong>Safety law</strong><p>In dangerous situations KIN may assist with coordination, information and escalation. It must not be represented as an emergency service, guaranteed safety system, medical decision-maker, or autonomous authority.</p></div></section>`}
function pitch(){return `<section class="panel full pitch"><span class="kicker">MEETING ASSET</span><h2>50 Instincts: a field study in human agency</h2><blockquote>We were given access to Instinct, so we asked a different question: what happens when people who normally do not get powerful technology finally have a proactive agent working for them?</blockquote><div class="pitchGrid"><div><h3>What we will show</h3><p>Verified deployments, failures, permission boundaries, user outcomes and what Instinct made possible that ordinary software did not.</p></div><div><h3>What we will not show</h3><p>Image generation, prompt tricks, fake case studies, vanity metrics or claims that have not survived a real deployment.</p></div><div><h3>The thesis</h3><p>Instinct's simple interface can become an accessibility layer for agency itself when deployment, training and human control are designed as carefully as the model.</p></div><div><h3>The proof format</h3><p>PERSON → PROBLEM → CONFIGURATION → ACTION → RESULT → EVIDENCE → FAILURE → LESSON.</p></div></div></section>`}
function bind(){if(state.tab!=='fleet')return;document.querySelectorAll('[data-agent]').forEach(r=>r.onclick=()=>{state.selected=r.dataset.agent;render()});const q=document.getElementById('query');q.oninput=e=>{state.query=e.target.value;render()};const a=()=>state.agents.find(x=>x.id===state.selected);['provisioningEmail','phone','instinctEmail','useCase','founder','org'].forEach(id=>{const el=document.getElementById(id);el.onchange=e=>{a()[id]=e.target.value;save();render()}});document.getElementById('status').onchange=e=>{a().status=e.target.value;save();render()};document.getElementById('proof').onchange=e=>{a().proof=e.target.value;save();render()};document.getElementById('reset').onclick=()=>{if(confirm('Reset all local KIN registry edits on this browser?')){state.agents=structuredClone(baseAgents);save();render()}}}
render();

</script></body></html>
