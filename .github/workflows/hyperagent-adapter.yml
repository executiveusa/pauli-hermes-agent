name: HyperAgent Adapter

on:
  pull_request:
    paths:
      - 'integrations/hyperagent/**'
      - 'skills/workflows/hyperagent-browser-operator/**'
      - 'tests/skills/test_hyperagent_browser_operator.py'
      - '.github/workflows/hyperagent-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated HyperAgent runtime
        working-directory: integrations/hyperagent
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify HyperAgent API surface
        working-directory: integrations/hyperagent
        run: npm run self-test
      - name: Install test runner
        run: python -m pip install pytest==9.0.2 pytest-timeout==2.4.0
      - name: Run static ICM contract tests
        run: python -m pytest tests/skills/test_hyperagent_browser_operator.py -q
