name: Test Vibe Client Factory

on:
  pull_request:
    paths:
      - "skills/studio/vibe-client-factory/**"
      - "skills/SKILL_REGISTRY.json"
      - "tests/skills/test_vibe_client_factory.py"
      - ".github/workflows/test-vibe-client-factory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.0.2 pytest-timeout==2.4.0
      - name: Compile workflow doctor
        run: python -m py_compile skills/studio/vibe-client-factory/scripts/doctor.py
      - name: Run Vibe Client Factory tests
        run: pytest -q tests/skills/test_vibe_client_factory.py
      - name: Run read-only workflow doctor
        run: python skills/studio/vibe-client-factory/scripts/doctor.py --json
