name: Test Campaign Factory QR

on:
  pull_request:
    paths:
      - "skills/studio/campaign-factory/**"
      - "tests/skills/test_campaign_factory_qr.py"
      - ".github/workflows/test-campaign-factory-qr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest==9.0.2 pytest-timeout==2.4.0
          python -m pip install --disable-pip-version-check -r skills/studio/campaign-factory/requirements.txt
      - name: Compile generator
        run: python -m py_compile skills/studio/campaign-factory/scripts/generate_qr.py
      - name: Run Campaign Factory QR tests
        run: pytest -q tests/skills/test_campaign_factory_qr.py
      - name: Generate Community Cuts smoke package
        run: |
          python skills/studio/campaign-factory/scripts/generate_qr.py \
            --url https://asc3nd.org \
            --campaign "Community Cuts for Kids" \
            --output /tmp/community-cuts-qr > /tmp/community-cuts-receipt.json
          test -s /tmp/community-cuts-qr/master/community-cuts-for-kids-qr.svg
          test -s /tmp/community-cuts-qr/master/community-cuts-for-kids-qr.png
          test -s /tmp/community-cuts-qr/master/community-cuts-for-kids-qr.pdf
          python -m json.tool /tmp/community-cuts-receipt.json >/dev/null
