name: Local Footage Studio Tests

on:
  pull_request:
    paths:
      - "skills/local-footage-studio/**"
      - ".github/workflows/local-footage-studio-tests.yml"
  push:
    branches: [main]
    paths:
      - "skills/local-footage-studio/**"
      - ".github/workflows/local-footage-studio-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile scripts
        run: |
          python -m py_compile \
            skills/local-footage-studio/scripts/footage_studio.py \
            skills/local-footage-studio/scripts/enrich_qvac.py

      - name: Run unit tests
        run: python -m unittest discover -s skills/local-footage-studio/tests -p "test_*.py" -v
