name: Repair Vibe Author Map

on:
  push:
    branches:
      - feat/vibe-client-factory-workflow
    paths:
      - .github/workflows/repair-vibe-author-map.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vibe-client-factory-workflow
          fetch-depth: 0
      - name: Add exact repository-owner mapping
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/release.py")
          content = path.read_text(encoding="utf-8")
          mapping = '    "executiveusa@gmail.com": "executiveusa",\n'
          marker = "AUTHOR_MAP = {\n"
          if mapping not in content:
              if marker not in content:
                  raise SystemExit("AUTHOR_MAP marker not found")
              content = content.replace(marker, marker + mapping, 1)
              path.write_text(content, encoding="utf-8")
          PY
      - name: Commit bounded mapping repair
        run: |
          if git diff --quiet -- scripts/release.py; then
            echo "Owner mapping already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/release.py
          git commit -m "chore: map repository owner attribution"
          git push origin HEAD:feat/vibe-client-factory-workflow
