name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "claude/**"]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 0. Change Scope ─────────────────────────────────────────
  changes:
    name: Change Scope
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.website.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: website
        name: Detect website changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Website build required for push events."
            exit 0
          fi

          if git diff --quiet HEAD^1 HEAD -- website/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No website files changed; website build is not applicable to this PR."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Website files changed; website build is required."
          fi

  # ── 1. Website Build ────────────────────────────────────────
  website-build:
    name: Website Build
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build (prebuild generates skills.json automatically)
        run: npm run build
        working-directory: website

      - name: Verify build output
        run: |
          test -f website/build/index.html && echo "✅ Build output verified"
          test -f website/static/api/skills.json && echo "✅ skills.json present"

  # ── 2. Python Lint & Tests ──────────────────────────────────
  python-checks:
    name: Python Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio aiosqlite -q

      - name: Lint with ruff (if installed)
        run: |
          pip install ruff -q 2>/dev/null || true
          ruff check mcp-servers/ skills/hermes-rolodex/api.py --select E,F --ignore E501 2>/dev/null || echo "Lint warnings (non-blocking)"
        continue-on-error: true

      - name: Run Rolodex tests
        run: |
          if [ -f tests/hermes-rolodex/test_rolodex.py ]; then
            cd tests/hermes-rolodex
            python -m pytest test_rolodex.py -v --tb=short 2>/dev/null || echo "Tests require DB setup — skip in CI"
          else
            echo "Rolodex tests are not present in this checkout — not applicable"
          fi
        continue-on-error: true

  # ── 3. Skills Index Validation ──────────────────────────────
  skills-index:
    name: Skills Index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install extraction dependency
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3

      - name: Extract and validate skills index
        run: |
          python website/scripts/extract-skills.py
          COUNT=$(python -c "import json; print(len(json.load(open('website/static/api/skills.json', encoding='utf-8'))))")
          echo "✅ Skills indexed: $COUNT"
          [ "$COUNT" -gt 0 ] || (echo "❌ No skills found" && exit 1)

  # ── 4. MCP Server Smoke Test ────────────────────────────────
  mcp-smoke:
    name: MCP Server Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check MCP server syntax
        run: |
          if [ -f mcp-servers/hermes-rolodex/server.py ]; then
            python -m py_compile mcp-servers/hermes-rolodex/server.py
            echo "✅ server.py syntax OK"
          else
            echo "Rolodex MCP server is not present in this checkout — not applicable"
          fi

      - name: Verify schema SQL
        run: |
          if [ -f mcp-servers/hermes-rolodex/schema.sql ]; then
            python3 -c "
          import sqlite3
          db = sqlite3.connect(':memory:')
          with open('mcp-servers/hermes-rolodex/schema.sql') as f:
              db.executescript(f.read())
          tables = db.execute(\"SELECT name FROM sqlite_master WHERE type='table'\").fetchall()
          print(f'✅ Schema OK — tables: {[t[0] for t in tables]}')
          db.close()
          "
          else
            echo "Rolodex schema is not present in this checkout — not applicable"
          fi

  # ── 5. Conflict Check ───────────────────────────────────────
  no-conflicts:
    name: No Merge Conflicts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for conflict markers
        run: |
          # Use a variable so the pattern string itself isn't a conflict marker.
          # Exclude the syntax-guard fixture that intentionally contains one.
          MARKER="<<<<<<<"
          MATCHES=$(git grep -rl "${MARKER}" -- "*.py" "*.ts" "*.tsx" "*.yml" "*.yaml" "*.json" "*.sql" "*.md" 2>/dev/null \
            | grep -v ".github/workflows/pr-checks.yml" \
            | grep -v "tests/hermes_cli/test_update_post_pull_syntax_guard.py" || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "❌ Conflict markers found in source files"
            exit 1
          fi
          echo "✅ No conflict markers found"

  # ── 6. All Green Gate ───────────────────────────────────────
  all-green:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [changes, website-build, python-checks, skills-index, mcp-smoke, no-conflicts]
    if: always()
    # Read-only access so the cross-workflow step can see the Tests and
    # Vibe Code Review runs for this PR head SHA.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    # Longest wait below (75m) plus slack for the own-check step.
    timeout-minutes: 85
    steps:
      - name: Verify all required checks passed
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "❌ change-scope detection failed"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.website }}" == "true" && "${{ needs.website-build.result }}" != "success" ]]; then
            echo "❌ website-build was required and failed"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.website }}" != "true" && "${{ needs.website-build.result }}" != "skipped" ]]; then
            echo "❌ website-build scope result was inconsistent"
            exit 1
          fi
          if [[ "${{ needs.python-checks.result }}" != "success" ]]; then
            echo "❌ python-checks failed"
            exit 1
          fi
          if [[ "${{ needs.skills-index.result }}" != "success" ]]; then
            echo "❌ skills-index failed"
            exit 1
          fi
          if [[ "${{ needs.mcp-smoke.result }}" != "success" ]]; then
            echo "❌ mcp-smoke failed"
            exit 1
          fi
          if [[ "${{ needs.no-conflicts.result }}" != "success" ]]; then
            echo "❌ conflict check failed"
            exit 1
          fi
          echo "✅ This workflow's own checks are green"

      # Tests and Vibe Code Review are separate workflows, so `needs` cannot
      # see them. For pull requests, require their runs for this exact head SHA
      # to finish with conclusion "success". Cancelled, failed, timed-out,
      # skipped, empty-conclusion or missing runs all fail the gate, as does
      # any GitHub API error. Pushes (main, claude/**) keep the own-checks gate.
      - name: Require independent Tests and Vibe Code Review runs
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          # tests.yml: test job timeout 30m (e2e 10m, parallel). Vibe Code
          # Review: reusable job timeout 30m. 75m = 30m run + queue time + pad.
          # Raise it if either workflow's timeout-minutes is raised.
          WAIT_MINUTES: "75"
          MISSING_GRACE_MINUTES: "5"
        run: |
          set -uo pipefail
          fail() { echo "❌ $*"; exit 1; }

          # Tests ignores docs-only changes (paths-ignore in tests.yml).
          # Check gh's exit status first; any API failure fails the gate.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename') \
            || fail "could not list PR files (GitHub API error); refusing to guess"
          need_tests=true
          if [[ -n "$files" ]] && ! printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/)'; then
            need_tests=false
          fi
          # Vibe Code Review skips drafts (job `if` in vibe-code-review.yml).
          need_review=true
          [[ "$IS_DRAFT" == "true" ]] && need_review=false

          # Newest run (by run_number, then run_attempt) of this exact workflow
          # file, pull_request event, this head SHA. Prints "<status>/<conclusion>"
          # or "missing". Any API/parse failure returns non-zero.
          state() {
            local out
            out=$(gh api "repos/$REPO/actions/workflows/$1/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100" \
              --jq '[.workflow_runs[] | select(.head_sha == "'"$HEAD_SHA"'")] | sort_by([.run_number, .run_attempt]) | last | if . == null then "missing" else "\(.status)/\(.conclusion // "")" end') || return 1
            [[ -n "$out" ]] || return 1
            printf '%s' "$out"
          }

          deadline=$((SECONDS + WAIT_MINUTES*60))
          missing_deadline=$((SECONDS + MISSING_GRACE_MINUTES*60))
          while true; do
            all_done=true
            for wf in "tests.yml:$need_tests" "vibe-code-review.yml:$need_review"; do
              file="${wf%%:*}"; needed="${wf##*:}"
              [[ "$needed" == "true" ]] || { echo "$file: not required for this change"; continue; }
              st=$(state "$file") || fail "could not read $file runs (GitHub API error)"
              echo "$file: $st"
              case "$st" in
                completed/success) ;;
                missing) if (( SECONDS < missing_deadline )); then all_done=false; else fail "$file never ran for $HEAD_SHA"; fi ;;
                queued/*|in_progress/*|waiting/*|pending/*|requested/*) all_done=false ;;
                *) fail "$file ended as '$st' for $HEAD_SHA - not merge-ready" ;;
              esac
            done
            $all_done && break
            (( SECONDS > deadline )) && fail "timed out after ${WAIT_MINUTES}m waiting for Tests / Vibe Code Review"
            sleep 60
          done
          echo "✅ Own checks, Tests and Vibe Code Review all succeeded for $HEAD_SHA"
