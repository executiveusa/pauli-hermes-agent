name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "claude/**"]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 0. Change Scope ─────────────────────────────────────────
  changes:
    name: Change Scope
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.website.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: website
        name: Detect website changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Website build required for push events."
            exit 0
          fi

          if git diff --quiet HEAD^1 HEAD -- website/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No website files changed; website build is not applicable to this PR."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Website files changed; website build is required."
          fi

  # ── 1. Website Build ────────────────────────────────────────
  website-build:
    name: Website Build
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build (prebuild generates skills.json automatically)
        run: npm run build
        working-directory: website

      - name: Verify build output
        run: |
          test -f website/build/index.html && echo "✅ Build output verified"
          test -f website/static/api/skills.json && echo "✅ skills.json present"

  # ── 2. Python Lint & Tests ──────────────────────────────────
  python-checks:
    name: Python Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio aiosqlite -q

      - name: Lint with ruff (if installed)
        run: |
          pip install ruff -q 2>/dev/null || true
          ruff check mcp-servers/ skills/hermes-rolodex/api.py --select E,F --ignore E501 2>/dev/null || echo "Lint warnings (non-blocking)"
        continue-on-error: true

      - name: Run Rolodex tests
        run: |
          if [ -f tests/hermes-rolodex/test_rolodex.py ]; then
            cd tests/hermes-rolodex
            python -m pytest test_rolodex.py -v --tb=short 2>/dev/null || echo "Tests require DB setup — skip in CI"
          else
            echo "Rolodex tests are not present in this checkout — not applicable"
          fi
        continue-on-error: true

  # ── 3. Skills Index Validation ──────────────────────────────
  skills-index:
    name: Skills Index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install extraction dependency
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3

      - name: Extract and validate skills index
        run: |
          python website/scripts/extract-skills.py
          COUNT=$(python -c "import json; print(len(json.load(open('website/static/api/skills.json', encoding='utf-8'))))")
          echo "✅ Skills indexed: $COUNT"
          [ "$COUNT" -gt 0 ] || (echo "❌ No skills found" && exit 1)

  # ── 4. MCP Server Smoke Test ────────────────────────────────
  mcp-smoke:
    name: MCP Server Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check MCP server syntax
        run: |
          if [ -f mcp-servers/hermes-rolodex/server.py ]; then
            python -m py_compile mcp-servers/hermes-rolodex/server.py
            echo "✅ server.py syntax OK"
          else
            echo "Rolodex MCP server is not present in this checkout — not applicable"
          fi

      - name: Verify schema SQL
        run: |
          if [ -f mcp-servers/hermes-rolodex/schema.sql ]; then
            python3 -c "
          import sqlite3
          db = sqlite3.connect(':memory:')
          with open('mcp-servers/hermes-rolodex/schema.sql') as f:
              db.executescript(f.read())
          tables = db.execute(\"SELECT name FROM sqlite_master WHERE type='table'\").fetchall()
          print(f'✅ Schema OK — tables: {[t[0] for t in tables]}')
          db.close()
          "
          else
            echo "Rolodex schema is not present in this checkout — not applicable"
          fi

  # ── 5. Conflict Check ───────────────────────────────────────
  no-conflicts:
    name: No Merge Conflicts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for conflict markers
        run: |
          # Use a variable so the pattern string itself isn't a conflict marker.
          # Exclude the syntax-guard fixture that intentionally contains one.
          MARKER="<<<<<<<"
          MATCHES=$(git grep -rl "${MARKER}" -- "*.py" "*.ts" "*.tsx" "*.yml" "*.yaml" "*.json" "*.sql" "*.md" 2>/dev/null \
            | grep -v ".github/workflows/pr-checks.yml" \
            | grep -v "tests/hermes_cli/test_update_post_pull_syntax_guard.py" || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "❌ Conflict markers found in source files"
            exit 1
          fi
          echo "✅ No conflict markers found"

  # ── 6. All Green Gate ───────────────────────────────────────
  all-green:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [changes, website-build, python-checks, skills-index, mcp-smoke, no-conflicts]
    if: always()
    steps:
      - name: Verify all required checks passed
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "❌ change-scope detection failed"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.website }}" == "true" && "${{ needs.website-build.result }}" != "success" ]]; then
            echo "❌ website-build was required and failed"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.website }}" != "true" && "${{ needs.website-build.result }}" != "skipped" ]]; then
            echo "❌ website-build scope result was inconsistent"
            exit 1
          fi
          if [[ "${{ needs.python-checks.result }}" != "success" ]]; then
            echo "❌ python-checks failed"
            exit 1
          fi
          if [[ "${{ needs.skills-index.result }}" != "success" ]]; then
            echo "❌ skills-index failed"
            exit 1
          fi
          if [[ "${{ needs.mcp-smoke.result }}" != "success" ]]; then
            echo "❌ mcp-smoke failed"
            exit 1
          fi
          if [[ "${{ needs.no-conflicts.result }}" != "success" ]]; then
            echo "❌ conflict check failed"
            exit 1
          fi
          echo "✅ All applicable required checks green — PR ready to merge"
