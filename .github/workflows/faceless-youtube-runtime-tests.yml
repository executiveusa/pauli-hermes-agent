name: Faceless YouTube Runtime Tests

on:
  pull_request:
    paths:
      - 'tools/faceless_youtube_runtime/**'
      - 'tests/tools/test_faceless_youtube_runtime.py'
      - 'scripts/install_faceless_youtube_runtime.py'
      - '.github/workflows/faceless-youtube-runtime-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: python -m pip install pytest==9.0.2 pytest-timeout==2.4.0 python-dotenv==1.2.2
      - name: Run runtime unit tests
        run: python -m pytest tests/tools/test_faceless_youtube_runtime.py -q
      - name: Compile runtime and installer
        run: python -m compileall -q tools/faceless_youtube_runtime scripts/install_faceless_youtube_runtime.py
