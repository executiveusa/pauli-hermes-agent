$schema: "https://json-schema.org/draft/2020-12/schema"
title: Hermes CLI Registry Entry
description: Schema for the internal catalog of Printing Press-generated or adopted CLIs.
type: object
required:
  - slug
  - domain
  - repo
  - install
  - auth
  - local_store
  - primary_commands
  - compound_workflows
  - risk_level
  - status
properties:
  slug:
    type: string
    pattern: "^[a-z0-9-]+$"
  domain:
    type: string
  repo:
    type: string
  install:
    type: string
  auth:
    type: string
  local_store:
    type: boolean
  primary_commands:
    type: array
    minItems: 1
    items:
      type: string
  compound_workflows:
    type: array
    items:
      type: string
  risk_level:
    type: string
    enum:
      - read_only
      - write
      - financial
      - legal
  status:
    type: string
    enum:
      - candidate
      - installed
      - dogfooded
      - production
      - deprecated
  approval_gate:
    type: string
    enum:
      - none
      - explicit_user_approval
      - two_person_review
  notes:
    type: string
additionalProperties: false
